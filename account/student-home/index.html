<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Dashboard | EchoAural</title>
  <link rel="stylesheet" href="/account/account.css" />
  <link rel="stylesheet" href="/account/student-home/student-dashboard.css" />
  <link rel="stylesheet" href="../../shared/css/ea-brand-logos.css" />
</head>
<body class="student-dashboard-v3 eahome-v4">
  <div class="eahome-shell">
    <aside class="eahome-sidebar">
      <a class="eahome-logo" href="/" aria-label="EchoAural home">
        <span class="account-wave" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span><span></span><span></span></span>
      </a>

      <nav class="eahome-nav" aria-label="Student navigation">
        <a class="eahome-nav-item is-active" href="#eahomeTop" data-dashboard-view="overall">
          <span class="eahome-nav-icon" aria-hidden="true"><img src="/assets/icons/navigation/home.svg" alt="" /></span>
          <span>Overall</span>
        </a>
        <button class="eahome-nav-item" type="button" data-dashboard-view="progress">
          <span class="eahome-nav-icon" aria-hidden="true"><img src="/assets/icons/dashboard/progress-mode.png" alt="" /></span>
          <span>Progress Mode</span>
        </button>
        <button class="eahome-nav-item" type="button" data-dashboard-view="quizzes">
          <span class="eahome-nav-icon" aria-hidden="true"><img src="/assets/icons/dashboard/join-live-session.png" alt="" /></span>
          <span>Live Sessions</span>
        </button>
        <button class="eahome-nav-item" type="button" data-dashboard-view="homework">
          <span class="eahome-nav-icon" aria-hidden="true"><img src="/assets/icons/dashboard/homework.png" alt="" /></span>
          <span>Homework</span>
        </button>
        <button class="eahome-nav-item is-disabled" type="button" disabled title="Not available yet">
          <span class="eahome-nav-icon" aria-hidden="true"><img src="/assets/icons/ui/settings.svg" alt="" /></span>
          <span>Settings</span>
        </button>
      </nav>

      <div class="eahome-sidebar-footer">
        <strong class="account-wordmark eahome-sidebar-wordmark"><span class="account-wordmark-echo">Echo</span><span class="account-wordmark-aural">Aural</span></strong>
      </div>
    </aside>

    <div class="eahome-main" id="eahomeTop">
      <header class="eahome-topbar">
        <div class="eahome-topbar-brand" aria-hidden="true">
          <span class="eahome-topbar-badge"><img id="eahomeTopbarIcon" src="/assets/icons/dashboard/overall-progress.png" alt="" /></span>
          <span class="eahome-topbar-brand-text"><span class="eahome-topbar-brand-main" id="eahomeTopbarTitleMain">Overall</span><span class="eahome-topbar-brand-gradient" id="eahomeTopbarTitleAccent">Progress</span></span>
        </div>

        <div class="eahome-topbar-right">
          <button class="eahome-icon-button" id="refreshProgressButton" type="button" title="Refresh results" aria-label="Refresh results">
            <img src="/assets/icons/ui/replay.svg" alt="" />
          </button>

          <div class="eahome-profile">
            <button class="eahome-profile-toggle" id="eahomeProfileToggle" type="button" aria-haspopup="true" aria-expanded="false">
              <span class="eahome-avatar" id="eahomeAvatarInitial">S</span>
              <span id="studentAccountName">Student</span>
              <svg class="eahome-chevron" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 6l4 4 4-4" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <div class="eahome-profile-menu" id="eahomeProfileMenu" hidden>
              <p class="eahome-profile-meta">Teacher <strong id="studentTeacherName">—</strong> · Code <strong id="studentTeacherCode">—</strong></p>
              <button class="eahome-profile-menu-button" id="studentLogoutButton" type="button">Log out</button>
            </div>
          </div>
        </div>

        <p class="progress-status eahome-status" id="progressStatus" role="status" aria-live="polite"></p>
      </header>

      <div class="eahome-content-grid">
        <div class="eahome-content-left">
          <section class="eahome-hero" id="eahomeHero" aria-label="Overall listening progress"></section>

          <section class="eahome-modules" id="eahomeModules" aria-label="Your learning modules">
            <div class="eahome-modules-grid" id="eahomeModulesGrid"></div>
          </section>

          <section class="eahome-stats-row" id="eahomeStatsRow" aria-label="Your stats"></section>
        </div>

        <aside class="eahome-content-right" id="eahomeRightColumn" aria-label="Next step, live session and homework"></aside>
      </div>
    </div>
  </div>

  <dialog class="dialog category-detail-dialog-v5 student-category-detail-dialog-v3" id="studentCategoryDetailDialog">
    <div class="dialog-inner category-detail-dialog-inner-v5">
      <div class="category-detail-heading-v5">
        <div class="category-detail-title-wrap-v5">
          <div class="category-detail-icon-slot-v5" aria-hidden="true"><span class="dashboard-line-icon-v5" id="studentCategoryDetailIcon" style="--ea-icon:url('/assets/icons/dashboard/progress-mode.png?v=11')"></span></div>
          <div>
            <p class="card-eyebrow" id="studentCategoryDetailEyebrow">My learning</p>
            <h2 class="section-title" id="studentCategoryDetailTitle">Detailed feedback</h2>
            <p class="section-copy" id="studentCategoryDetailSubtitle">Your saved EchoAural progress.</p>
          </div>
        </div>
        <div class="pm-heading-brand" id="studentPmHeadingBrand" aria-hidden="true"></div>
        <button class="dialog-close-button" id="closeStudentCategoryDetail" type="button" aria-label="Close detailed feedback">×</button>
      </div>
      <div id="studentCategoryDetailContent"><div class="progress-empty-state">Choose a learning area to view detailed feedback.</div></div>
    </div>
  </dialog>

  <dialog class="eahome-history-dialog" id="studentQuestionHistoryDialog" aria-labelledby="studentQuestionHistoryTitle">
    <div class="eahome-history-dialog-inner">
      <header class="eahome-history-heading">
        <div class="eahome-history-title-wrap">
          <span class="eahome-history-title-icon" aria-hidden="true"><img src="/assets/icons/dashboard/questions-answered.png" alt="" /></span>
          <div>
            <p>Recent activity</p>
            <h2 id="studentQuestionHistoryTitle">Question history</h2>
            <span>Search every saved question across your learning modes.</span>
          </div>
        </div>
        <button class="eahome-history-close" id="closeStudentQuestionHistory" type="button" aria-label="Close question history">×</button>
      </header>

      <div class="eahome-history-filters" aria-label="Question history filters">
        <label><span>Search</span><input id="questionHistorySearch" type="search" placeholder="Question, feedback or app" /></label>
        <label><span>Mode</span><select id="questionHistoryMode"><option value="">All modes</option><option value="progress">Progress Mode</option><option value="quizzes">Live Sessions</option><option value="homework">Homework</option></select></label>
        <label><span>Date</span><input id="questionHistoryDate" type="date" /></label>
        <label><span>Musical element</span><select id="questionHistoryElement"><option value="">All elements</option></select></label>
        <label><span>Sub-app</span><select id="questionHistoryApp"><option value="">All sub-apps</option></select></label>
      </div>

      <div class="eahome-history-summary" id="questionHistorySummary" aria-live="polite"></div>
      <div class="eahome-history-results" id="questionHistoryResults"></div>
    </div>
  </dialog>

  <script src="/account/account-common.js"></script>
  <script src="/shared/js/progression-store.js"></script>
  <!-- Progress Mode (modules/progress-mode/) is a self-contained,
       localStorage-only feature, not connected to the server-side
       progress API above — its own store.js/app-drivers.js/feedback.js
       are loaded here read-only so the "Detailed feedback" dialog can
       render its per-area levels and written feedback directly. -->
  <script src="/modules/progress-mode/store.js"></script>
  <script src="/modules/progress-mode/app-drivers.js"></script>
  <script src="/modules/progress-mode/feedback.js"></script>
  <!-- Canonical sub-app -> server moduleId/area mapping, used to combine
       Progress Mode evidence with Live Session/Homework marks per sub-app
       and per area (see student-home.js's getCombinedSourceStats). -->
  <script src="/shared/js/pm-registry.js"></script>
  <script src="/account/student-home/student-home.js"></script>
</body>
</html>
