<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Join EchoAural Classroom</title>
  <meta name="robots" content="noindex" />
</head>
<body>
  <p>Opening EchoAural student join…</p>
  <script>
    (function () {
      var parts = window.location.pathname.split('/').filter(Boolean);
      var possibleRoom = parts.length >= 2 && (parts[0] === 'join' || parts[0] === 'j') ? parts[1] : '';
      var params = new URLSearchParams(window.location.search);

      if (possibleRoom && !params.get('room')) {
        params.set('room', possibleRoom.toUpperCase().replace(/[^A-Z0-9]/g, ''));
      }

      var query = params.toString();
      var target = '/student/join.html' + (query ? '?' + query : '') + window.location.hash;
      window.location.replace(target);
    }());
  </script>
  <noscript>
    <p><a href="/student/join.html">Continue to student join</a></p>
  </noscript>
</body>
</html>
