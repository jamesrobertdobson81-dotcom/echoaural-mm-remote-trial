services:
  - type: web
    name: echoaural-classroom-api
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm run render:start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: PILOT_SIGNUP_CODE
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: EchoAural <welcome@echoaural.com>
      - key: EMAIL_REPLY_TO
        value: hello@echoaural.com
      - key: PUBLIC_SITE_URL
        value: https://listen.echoaural.com
      - key: PUBLIC_API_URL
        value: https://teacher-api.echoaural.com
      - key: PUBLIC_HOST
        value: teacher-api.echoaural.com
      - key: PUBLIC_PROTOCOL
        value: https
      - key: ACCOUNT_ALLOWED_ORIGINS
        value: https://listen.echoaural.com,https://www.listen.echoaural.com,https://echoaural.com,https://www.echoaural.com,https://jamesrobertdobson81-dotcom-echoaural-mm.onrender.com
      - key: ROOM_MAX_AGE_MS
        value: "43200000"
